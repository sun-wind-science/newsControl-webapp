services:
  - type: web
    name: newscontrol-backend
    runtime: python
    repo: https://github.com/sun-wind-science/newsControl-webapp
    branch: main
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: newscontrol-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: newscontrol-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: newscontrol-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: newscontrol-redis
          property: connectionString
      - key: AI_PROVIDER
        value: openai
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: CORS_ORIGINS
        value: http://localhost:3000,http://127.0.0.1:3000

  - type: web
    name: newscontrol-frontend
    runtime: node
    repo: https://github.com/sun-wind-science/newsControl-webapp
    branch: main
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -p $PORT
    envVars:
      - key: BACKEND_HOSTPORT
        fromService:
          type: web
          name: newscontrol-backend
          property: hostport

  - type: redis
    name: newscontrol-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: newscontrol-postgres
    plan: free
    databaseName: content_digest
    user: content
